[project]
name = "ORTSOC_Slack_App"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt==1.30.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [

]

[tool.setuptools.packages.find]
include = ["listeners*"]

[tool.ruff]
line-length = 125
exclude = [".venv", "venv"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
